name: Production Build & Deploy

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.npmrc'
      - 'README.md'
      - 'docs/**'
  schedule:
    # Daily Maghrib sync (~19:05 UTC). Apps also get correct Maghrib on /today reads.
    - cron: '5 19 * * *'
    # Recurring event reminders (~15 minutes before start).
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      run_maghrib_sync:
        description: 'Run Maghrib sync only (skip deploy)'
        required: false
        type: boolean
        default: true

env:
  NODE_VERSION: '18.x'
  PRODUCTION_API_URL: 'https://alasrbackend.vercel.app'

jobs:
  notify-events:
    name: Notify upcoming events
    if: github.event_name == 'schedule' && github.event.schedule == '*/10 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger event reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set; skipping event reminders"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "${PRODUCTION_API_URL}/api/v1/cron/notify-upcoming-events"

  sync-maghrib:
    name: Sync Maghrib schedules
    if: (github.event_name == 'schedule' && github.event.schedule == '5 19 * * *') || (github.event_name == 'workflow_dispatch' && inputs.run_maghrib_sync == true)
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Maghrib sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set; skipping DB sync. Users still see Maghrib from the city schedule / sunset overlay."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "${PRODUCTION_API_URL}/api/v1/cron/update-maghrib"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "${PRODUCTION_API_URL}/api/v1/cron/cleanup-activity-logs"

  build-and-deploy:
    name: Build and Deploy to Production
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm ci
          echo "✅ Dependencies installed successfully"
      
      - name: Verify mysql2 installation
        run: |
          npm list mysql2 || echo "⚠️ Warning: mysql2 not found"
          npm list sequelize || echo "⚠️ Warning: sequelize not found"
      
      - name: Run linting (optional)
        continue-on-error: true
        run: |
          echo "Running lint checks..."
          # Add your lint command here if you have one
          # npm run lint
      
      - name: Run tests (optional)
        continue-on-error: true
        run: |
          echo "Running tests..."
          # Uncomment if you want tests to run
          # npm test || true
      
      - name: Check build
        run: |
          echo "✅ Build check passed"
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "Package count: $(npm list --depth=0 2>/dev/null | wc -l)"
      
      - name: Display deployment info
        run: |
          echo "🚀 Deployment triggered by: ${{ github.actor }}"
          echo "📦 Commit: ${{ github.sha }}"
          echo "🔀 Branch: ${{ github.ref }}"
          echo "📝 Message: ${{ github.event.head_commit.message }}"
      
      - name: Build complete
        run: |
          echo "✅ Build process completed successfully!"
          echo "🚀 Deploying to Vercel..."
      
      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret is not set"
            exit 1
          fi
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          url=$(npx --yes vercel@latest deploy --prod --token="$VERCEL_TOKEN")
          echo "DEPLOYMENT_URL=$url" >> "$GITHUB_ENV"
          echo "Deployed to $url"
      
      - name: Deployment complete
        run: |
          echo "✅ Deployment to Vercel completed!"
          echo "🔗 Deployment URL: ${{ env.DEPLOYMENT_URL }}"
          echo "🔗 Live URL: https://alasrbackend.vercel.app"

  notify:
    name: Notify on success
    needs: build-and-deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && success()
    
    steps:
      - name: Deployment success notification
        run: |
          echo "✅ Production build completed successfully!!"
          echo "🔗 Deployment URL: https://alasrbackend.vercel.app"
          echo "📊 View deployment: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

